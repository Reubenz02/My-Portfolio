<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Artist Discography and Audio Analyzer</title>
        <link rel="stylesheet" href="style.css"/>
    </head>
    <body>
        <div class="container">
            <header>
                <h1> Artist Discography and Audio Analyzer</h1>
                <p>Search any artist to explore discography stats, release timelines and 30-sec audio previews</p>
            </header>

            <section class="search-section">
                <div class="search-bar">
                     <input type="text" id="artistInput" placeholder="Enter artist name (e.g., Daft Punk)..." value="Daft Punk" />
                     <button id="searchBtn">Analyze</button>
                </div>
             <div class="presets">
                    <span>Quick picks :</span>
                    <button class="preset-btn" data-artist="Daft Punk">Daft Punk</button>
                    <button class="preset-btn" data-artist="Maroon 5">Maroon 5</button>
                    <button class="preset-btn" data-artist="The Weeknd">The Weeknd</button>
                    <button class="preset-btn" data-artist="Imagine Dragons">Imagine Dragons</button>
                </div>
            </section>

            <div id="statusMsg" class="status-msg"></div>
            
            <main id="dashboard" class="hidden">
              <h2 id="artistHeading">Overview</h2>

              <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-label">Tracks Analyzed</span>
                    <span class="stat-value" id="statTracks">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Unique Albums</span>
                    <span class="stat-value" id="statAlbums">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Average Length</span>
                    <span class="stat-value" id="statAvgLen">0:00</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Primary Genre</span>
                    <span class="stat-value" id="statGenre">-</span>
                </div>
            </div>
            
            <section class="chart-section">
                <h3> Tracks by Release Year</h3>
                <div id ="yearchart" class="bar-chart"></div>
            </section>

            <section class="controls-bar">
                <select id="albumFilter">
                    <option value="All">All Albums</option>
                </select>
            <select id="sortselect">
                <option value="default">Sort: Popularity</option>
                <option value="newest">Sort : Newest First</option>
                <option value="oldest">Sort : Oldest First</option>
                <option value="longest">Sort : Longest First</option>
            </select>
         </section>

         <section>
            <h3> Top Tracks & 30s previews</h3>
            <div id="trackList" class="track-list"></div>
         </section>
        </main>
    </div>

   <script src="script.js"></script>
</body>
</html>
